package:
  name: dual_dimc
  authors:
    - "Mennatalla Hassan <mennatalla.hassan@studio.unibo.it>"

dependencies:
  common_cells: {git: https://github.com/pulp-platform/common_cells.git, version: 1.21.0}
  hwpe-stream:  {git: "https://github.com/pulp-platform/hwpe-stream.git", version: 1.10.0}
  hci:          {git: "https://github.com/pulp-platform/hci.git",         version: 2.6.0}
  hwpe-ctrl:    {git: "https://github.com/pulp-platform/hwpe-ctrl.git",   version: 3.0.2}

sources:
  - target: not(asic)
    files:
      - rtl/spatz_dimc.sv
  - target: asic
    files:
      - cleopatra_gf22/sourcecode/tc_clk.sv
  - files:
      - rtl/dimc_package.sv
      - rtl/dimc_hci_mux.sv
      - rtl/dimc_streamer.sv
      - rtl/dimc_ctrl.sv
      - rtl/dimc_top.sv
      - rtl/accumulator.sv
      - rtl/cleopatra_ctrl.sv

  - target: asic
    files:
      - rtl/dimc_top_wrap_package.sv
      - rtl/dimc_top_wrap.sv

  - target: tb
    files:
      - tb/tb_spatz_dimc.sv
      - tb/tb_dimc_test1_timing.sv
      - tb/tb_dimc_top.sv
