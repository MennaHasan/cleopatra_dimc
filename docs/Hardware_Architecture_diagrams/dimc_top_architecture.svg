<text x="170" y="1290" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" fill="#172033">Repeated clock / reset labels denote the same top-level inputs, drawn separately for readability.</text>
<text x="170" y="1315" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" fill="#172033">Interface arrows show payload flow; periph and HCI / stream interfaces also carry reverse-direction handshake signals.</text>
<text x="145" y="1360" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start" fill="#172033">¹ config_o(config_) connects to these datapath input ports (port ← config_ field):</text>
<text x="165" y="1386" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" fill="#172033">weight_rows_i ← weight_rows; weight_cols_i ← weight_cols; input_rows_i ← input_rows; input_cols_i ← input_cols;</text>
<text x="165" y="1410" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" fill="#172033">mode_i ← mode; sign_8b_i ← sign_8b; bias_i ← bias; write_mask_i ← write_mask; compute_mask_i ← compute_mask.</text>
<text x="145" y="1440" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" fill="#172033">HCI ports: initiators, 32-bit byte addresses.   evt_o width: N_CORES × REGFILE_N_EVT.</text>
